# Serving the built PWA. **Everything here must match `vercel.json`.** That file is what the primary
# deployment sends; this is what the container sends.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression ---
    # nginx does this, unlike the API where the application does it.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # --- Security headers ---
    # Transcribed from `vercel.json`.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # camera/microphone/display-capture are `(self)` rather than empty because the Live tab holds
    # peer-to-peer calls, and an empty allowlist blocks `getUserMedia` for this origin too.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), interest-cohort=()" always;

    # `connect-src ... https: wss:` is what lets the browser reach the API and open the Socket.io
    # connection on whatever host this build was pointed at.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' https: blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob: https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    # nginx announces its version by default. Not a vulnerability — it is
    # trivially fingerprinted anyway — but there is no reason to volunteer it.
    server_tokens off;

    # --- Caching ---
    location /assets/ {
        # No `expires` directive here, deliberately. `expires` emits a `Cache-Control` of its own,
        # so pairing it with the `add_header` below sends the header *twice*.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # `add_header` does not inherit into a nested location block — setting one here discards
        # every header from the server block.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri =404;
    }

    # The service worker is the opposite case and the one that goes wrong. It has no hash in its
    # name, and a cached copy is a copy of the *caching policy itself*.
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- The SPA fallback ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `index.html` itself must never be cached. It is the document that names every hashed asset. A
    # stale copy points at a build that no longer exists.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' https: blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob: https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    }

    # --- Noise ---
    location = /favicon.svg {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /robots.txt  { access_log off; }
}
