# Serving the built PWA.
#
# ## The rule this file follows
#
# **Everything here must match `vercel.json`.** That file is what the primary
# deployment sends; this is what the container sends. Two deployments of the
# same application that disagree about their Content-Security-Policy is a bug
# that only appears on one of them, and the one it appears on is whichever
# nobody tested — so the headers below are a deliberate transcription, and a
# change to either file belongs in the same commit as the change to the other.
#
# The one place they cannot match is caching: Vercel keys `/assets/` off its
# own build output, and here it is a `location` block. The intent is identical.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compression --------------------------------------------------------
    #
    # nginx does this, unlike the API where the application does it. There is
    # no Node process in this container to do it instead, and static text
    # compresses extremely well — the JS bundle is roughly a third of its size
    # gzipped.
    #
    # `gzip_static` first: if a `.gz` sits beside a file it is served directly
    # rather than compressed again per request. Vite does not emit those today,
    # so this costs a stat and is here for the day it does.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        font/woff
        font/woff2;

    # --- Security headers ---------------------------------------------------
    #
    # Transcribed from `vercel.json`. `always` on every one of them, because
    # without it nginx omits `add_header` on error responses — so a 404 or a
    # 500 would be served with no CSP at all, which is precisely the response
    # most likely to be reflecting something back.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # camera/microphone/display-capture are `(self)` rather than empty because
    # the Live tab holds peer-to-peer calls, and an empty allowlist blocks
    # `getUserMedia` for this origin too — not just for embeds. That was a real
    # outage on Vercel before it was noticed; see SETUP.md in the API repo.
    add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), interest-cohort=()" always;

    # `connect-src ... https: wss:` is what lets the browser reach the API and
    # open the Socket.io connection on whatever host this build was pointed at.
    # `frame-src blob:` is the PDF viewer on the text board.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' https: blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob: https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    # nginx announces its version by default. Not a vulnerability — it is
    # trivially fingerprinted anyway — but there is no reason to volunteer it.
    server_tokens off;

    # --- Caching ------------------------------------------------------------
    #
    # Two rules, and the split is the whole of it.
    #
    # Everything under `/assets/` carries a content hash in its filename, so a
    # given URL's bytes never change: it is safe to cache forever, and
    # `immutable` additionally tells the browser not to revalidate on reload.
    location /assets/ {
        # No `expires` directive here, deliberately.
        #
        # `expires` emits a `Cache-Control` of its own, so pairing it with the
        # `add_header` below sends the header *twice* — `max-age=31536000`
        # followed by `public, max-age=31536000, immutable`. Browsers do not
        # agree on which of two Cache-Control headers wins, and the one that
        # matters here is the one carrying `immutable`.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # `add_header` does not inherit into a nested location block — setting
        # one here discards every header from the server block. Repeated rather
        # than deduplicated, because nginx offers no way to merge them and a
        # silently unprotected asset path is the failure this avoids.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        try_files $uri =404;
    }

    # The service worker is the opposite case and the one that goes wrong.
    #
    # It has no hash in its name, and a cached copy is a copy of the *caching
    # policy itself* — so a browser holding an old `sw.js` keeps serving an old
    # application, and will keep doing so after a deploy, indefinitely. This is
    # the single most common way a PWA appears not to have updated.
    location = /sw.js {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- The SPA fallback ---------------------------------------------------
    #
    # Every path that is not a real file is `index.html`, so a deep link —
    # `/projects/<id>?tab=live` out of somebody's email — loads the app, which
    # then reads the URL and renders the right screen. Without it that request
    # is a 404 from nginx and the router never runs.
    #
    # `$uri/` before the fallback so a real directory still gets its index.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # `index.html` itself must never be cached.
    #
    # It is the document that names every hashed asset. A stale copy points at
    # a build that no longer exists, and the result is a blank page with 404s
    # in the console — for exactly as long as the cache entry lives.
    location = /index.html {
        add_header Cache-Control "public, max-age=0, must-revalidate" always;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), interest-cohort=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; media-src 'self' https: blob:; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob: https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;
    }

    # --- Noise --------------------------------------------------------------
    #
    # `access_log off` on the favicon, because a browser asks for it on every
    # page and the log is more useful without several hundred identical lines.
    location = /favicon.svg {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /robots.txt  { access_log off; }
}
