# The frontend, built and served locally. Not the primary deployment — that is Vercel, and this
# repository is set up for it.

name: task-studio-ui

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # No defaults. `vite.config.ts` aborts the build when `VITE_API_URL` is absent rather than
        # baking in a localhost address that would fail for every visitor.
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL, including the /api/v1 suffix}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:?set VITE_SOCKET_URL, the API origin with no path}

    restart: unless-stopped

    ports:
      # Deliberately not 80. This is a container serving plain HTTP, and it belongs behind something
      # that terminates TLS — either Caddy on the droplet.
      - '8080:80'

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
