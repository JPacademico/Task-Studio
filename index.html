<!doctype html>
<html lang="en" class="dark" data-skin="studio">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- viewport-fit=cover + safe-area padding is what makes the standalone
         iOS window look native instead of letterboxed. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover"
    />
    <link rel="mask-icon" href="/favicon.svg" color="#facc5a" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f6f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0f12" />

    <!-- iOS standalone hints (Safari still ignores parts of the manifest). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Task Studio" />

    <meta name="description" content="Personal and collaborative project management studio." />
    <title>Task Studio</title>

    <!-- Palette and skin, applied before first paint. An external file rather
         than an inline block so the CSP in vercel.json can refuse
         script-src 'unsafe-inline' outright - see public/theme-init.js. -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
